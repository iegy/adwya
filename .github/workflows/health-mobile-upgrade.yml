name: Health content and mobile upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_health_mobile.py'
      - '.github/workflows/health-mobile-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply upgrade
        run: python3 scripts/upgrade_health_mobile.py
      - name: Validate generated files
        run: |
          test -f health.html
          test -f health/healthy-diet.html
          test -f health/supplements.html
          grep -q 'صحة وتغذية' index.html
          grep -q 'overflow-x:clip' theme-v2.css
          git diff --check
      - name: Commit upgrade and clean one-time files
        run: |
          rm -f scripts/upgrade_health_mobile.py .github/workflows/health-mobile-upgrade.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add health library and improve mobile responsiveness'
          git push
