name: Apply mobile search hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-search-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile search fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('src="site-shell.js"', 'src="site-shell.js?v=9"')
          s=s.replace('src="app.js"', 'src="app.js?v=9"')
          p.write_text(s, encoding='utf-8')

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("search-worker.js?v=7", "search-worker.js?v=9")
          s=s.replace("sw.js?v=7", "sw.js?v=9")
          s=s.replace("},12000)", "},45000)")
          p.write_text(s, encoding='utf-8')
          PY
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check search-worker.js
          node --check sw.js
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js
          if git diff --cached --quiet; then
            echo 'No hotfix changes needed.'
          else
            git commit -m 'fix: allow medicine database to initialize on slower phones'
            git push
          fi
